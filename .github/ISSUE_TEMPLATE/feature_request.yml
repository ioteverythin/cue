name: Feature or integration
description: A new integration, language, setting or capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The voice-agent stack you use and where Cue falls short today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to open a pull request for this
