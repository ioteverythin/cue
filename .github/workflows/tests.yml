name: tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.python }}" = "3.10" ]; then pip install -e ".[dev]"; else pip install -e ".[dev,pipecat]"; fi
      - name: Test
        # tests that need a model download Cue Tiny from Hugging Face, and are skipped when it is not reachable
        run: pytest -q
